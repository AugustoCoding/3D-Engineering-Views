# Publica a maquete no GitHub Pages a cada push na main.
#
# O HTML e gerado aqui, a partir do clone limpo, e nao copiado do
# artifact/: no clone nao existe nenhum *.local.js (a foto do rosto fica fora
# do git), entao o que vai ao ar nunca leva dado local, mesmo que alguem
# commite um artifact/ errado.
#
# As acoes vao fixadas por hash (a tag pode ser movida; o hash, nao). O
# Dependabot (.github/dependabot.yml) abre PR quando sair versao nova.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# um deploy por vez; o mais novo cancela o que ainda espera
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # no plano gratuito, Pages so existe em repositorio publico: enquanto ele
    # for privado o job e pulado, em vez de falhar a cada push
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Montar o site
        run: |
          mkdir _site
          cp artifact/maquete-planta.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
